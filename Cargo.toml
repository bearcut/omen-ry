[package]
name = "omen-ry"
version = "0.1.0"
edition = "2021"
authors = ["bearcut"]
description = "Lightweight event-driven 4-zone RGB daemon for HP OMEN laptops"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "rt", "time", "net", "sync", "signal", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
